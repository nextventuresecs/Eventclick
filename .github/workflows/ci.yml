name: CI

on:
  # Deliberately unfiltered: every commit that lands on main or develop gets a
  # full run, and deploy.yml chains off this workflow completing on main. A
  # paths filter here would skip CI for a docs-only merge and, with it, deploy.
  push:
    branches: [main, develop]

  # Documentation-only PRs can't affect lint, unit tests or Playwright, so skip
  # the run rather than spend an E2E job on a typo fix. Safe to do here because
  # main has no required status checks — a skipped required check never reports
  # and would leave PRs permanently unmergeable. Revisit this if that changes.
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint and Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Blocking, deliberately. This step carried `continue-on-error: true`,
      # which turned a high-severity advisory into an orange tick that the
      # pipeline walked straight past on its way to deploying. A gate that
      # cannot fail is a report, not a gate.
      #
      # The three high-severity advisories that existed when this was turned
      # on (brace-expansion, fast-uri, nanoid) were resolved via `npm audit
      # fix` first — turning the gate on over a known-failing tree would just
      # have produced a red pipeline someone reverts.
      #
      # Moderates stay below the threshold: the remaining four are in
      # esbuild/drizzle-kit build tooling that never runs in production, and
      # clearing them needs a breaking `npm audit fix --force`.
      - run: npm audit --audit-level=high

  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-at-least-16
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-at-least-16
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: test-secret-at-least-16-chars
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: eventclick-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      COOKIE_DOMAIN: localhost
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      RESEND_API_KEY: test-resend-api-key
      SQS_QUEUE_URL: http://localhost:4566/000000000000/eventclick-test-queue
      SQS_PDF_QUEUE_URL: http://localhost:4566/000000000000/eventclick-test-pdf-queue
      SQS_DLQ_URL: http://localhost:4566/000000000000/eventclick-test-dlq
      SENTRY_SERVER_DSN: ""
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d eventclick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@application/shared

      - run: npm run test --workspace=@application/shared
      - run: npm run test --workspace=client
      
      - name: Initialize Database Roles
        run: PGPASSWORD=test psql -U test -h localhost -p 5432 -d eventclick_test -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server
      
      - name: Verify RLS Policies
        run: PGPASSWORD=test psql -U test -h localhost -p 5432 -d eventclick_test -v ON_ERROR_STOP=1 -f scripts/rls-live-test.sql
      
      - run: npm run test --workspace=server

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    env:
      NODE_ENV: test
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE_URL: http://localhost:4000
      PLAYWRIGHT_ADMIN_PASSWORD: "e2e_admin_password_123!"
      PLAYWRIGHT_VOLUNTEER_PASSWORD: "e2e_volunteer_password_123!"
      DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      REDIS_URL: redis://localhost:6379/1
      GOTENBERG_URL: http://localhost:8686
      JWT_SECRET: test-jwt-secret-at-least-16
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-at-least-16
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: test-secret-at-least-16-chars
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: eventclick-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      COOKIE_DOMAIN: localhost
      GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
      RESEND_API_KEY: test-resend-api-key
      SQS_QUEUE_URL: http://localhost:4566/000000000000/eventclick-test-queue
      SQS_PDF_QUEUE_URL: http://localhost:4566/000000000000/eventclick-test-pdf-queue
      SQS_DLQ_URL: http://localhost:4566/000000000000/eventclick-test-dlq
      SENTRY_SERVER_DSN: ""
      CI: "true"
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d eventclick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 8686:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@application/shared

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Initialize Database Roles
        run: PGPASSWORD=test psql -U test -h localhost -p 5432 -d eventclick_test -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Start MinIO S3 Container
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          
          echo "Waiting for MinIO..."
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready."
              break
            fi
            sleep 1
          done
          
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb --ignore-existing local/eventclick-test
          echo "MinIO test bucket ready."

      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server

      - name: Run Playwright E2E Tests
        run: npm run test --workspace=e2e

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14