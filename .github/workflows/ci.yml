name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-audit:
    name: Lint and Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm audit --audit-level=high
        continue-on-error: true

  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run test --workspace=@application/shared
      - run: npm run test --workspace=client
      
      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      
      - name: Verify RLS Policies
        run: PGPASSWORD=test psql -U test -h localhost -p 5432 -d eventclick_test -v ON_ERROR_STOP=1 -f scripts/rls-live-test.sql
      
      - run: npm run test --workspace=server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
          REDIS_URL: redis://localhost:6379/1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test

      - run: npm run test --workspace=e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:4000
          PLAYWRIGHT_ADMIN_PASSWORD: "e2e_admin_password_123!"
          PLAYWRIGHT_VOLUNTEER_PASSWORD: "e2e_volunteer_password_123!"
          DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
          APP_DATABASE_URL: postgresql://app_user_login:local_dev_app@localhost:5432/eventclick_test
          AUTH_DATABASE_URL: postgresql://auth_svc_role:local_dev_auth@localhost:5432/eventclick_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: test-jwt-secret-at-least-16
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-at-least-16
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_PUBLIC_URL: ws://localhost:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: test-secret-at-least-16-chars
          S3_ENDPOINT: http://localhost:9000
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: eventclick-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
          

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 14
