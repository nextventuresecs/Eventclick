name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint and Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm audit --audit-level=high
        continue-on-error: true

  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      APP_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      AUTH_DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-jwt-secret-at-least-16
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-at-least-16
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: test-secret-at-least-16-chars
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: eventclick-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npm run test --workspace=@application/shared
      - run: npm run test --workspace=client
      
      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server
      
      - name: Verify RLS Policies
        run: PGPASSWORD=test psql -U test -h localhost -p 5432 -d eventclick_test -v ON_ERROR_STOP=1 -f scripts/rls-live-test.sql
      
      - run: npm run test --workspace=server

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    env:
      NODE_ENV: test
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE_URL: http://localhost:4000
      PLAYWRIGHT_ADMIN_PASSWORD: "e2e_admin_password_123!"
      PLAYWRIGHT_VOLUNTEER_PASSWORD: "e2e_volunteer_password_123!"
      DATABASE_URL: postgresql://test:test@localhost:5432/eventclick_test
      APP_DATABASE_URL: postgresql://app_user_login:local_dev_app@localhost:5432/eventclick_test
      AUTH_DATABASE_URL: postgresql://auth_svc_role:local_dev_auth@localhost:5432/eventclick_test
      REDIS_URL: redis://localhost:6379/1
      GOTENBERG_URL: http://localhost:3000
      JWT_SECRET: test-jwt-secret-at-least-16
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-at-least-16
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: test-secret-at-least-16-chars
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: eventclick-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CI: "true"
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventclick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Database Migrations
        run: npm run db:migrate --workspace=server

      - name: Run Playwright E2E Tests
        run: npm run test --workspace=e2e

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14
