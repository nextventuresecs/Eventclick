name: CI

on:
  push:
    branches: [main]
    # Only run CI when actual code changes — skip docs-only commits
    # (Saves GitHub Actions minutes on the free plan)
    paths:
      - 'packages/**'
      - 'docker-compose*.yml'
      - 'packages/**/Dockerfile*'
      - 'Dockerfile*'
      - '.github/workflows/**'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'package*.json'

  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'docker-compose*.yml'
      - 'packages/**/Dockerfile*'
      - 'Dockerfile*'
      - '.github/workflows/**'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'package*.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
