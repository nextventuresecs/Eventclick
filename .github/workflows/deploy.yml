name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline Design:
#
#  CI passes → Approval Gate (production env) → SSH → deploy.sh → verify
#
# Key decisions:
#  - Build images in CI (GitHub Actions), NOT on EC2 (t3.small can't handle it)
#  - ghcr.io as the image registry (free, integrated)
#  - deploy.sh on EC2 handles: pull image, migrate, restart, health check, rollback
#  - GitHub Environment "production" provides manual approval gate
#  - if: failure() step triggers rollback notification
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Auto-deploy only when CI pipeline passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Allow manual trigger for hotfixes or forced redeploys
  workflow_dispatch:
    inputs:
      skip_approval:
        description: 'Skip approval gate (emergency deploy only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel an in-progress deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ── Job 1: Gate — Only continue if CI passed ──────────────────────────────────
jobs:
  check-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.check.outputs.deploy }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - name: Set deploy flag
        id: check
        run: echo "deploy=true" >> $GITHUB_OUTPUT

      - name: Extract commit metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT

  # ── Job 2: Build & Push Docker Images to ghcr.io ─────────────────────────
  build:
    name: Build & Push Images
    needs: check-ci
    runs-on: ubuntu-latest
    if: needs.check-ci.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    outputs:
      server_image: ${{ steps.image-tags.outputs.server_image }}
      client_image: ${{ steps.image-tags.outputs.client_image }}
      sha_short: ${{ needs.check-ci.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checkout the commit that triggered CI (not the current HEAD)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          SHA="${{ needs.check-ci.outputs.sha_short }}"
          REPO_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "server_image=${{ env.REGISTRY }}/${REPO_LOWER}/server" >> $GITHUB_OUTPUT
          echo "client_image=${{ env.REGISTRY }}/${REPO_LOWER}/client" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # Build Server Image — multi-stage: deps → build → runner (non-root)
      - name: Build & Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.image-tags.outputs.server_image }}:latest
            ${{ steps.image-tags.outputs.server_image }}:${{ steps.image-tags.outputs.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false

      # Build Client Image — includes Vite build args (VITE_* are build-time only)
      - name: Build & Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.image-tags.outputs.client_image }}:latest
            ${{ steps.image-tags.outputs.client_image }}:${{ steps.image-tags.outputs.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_LIVEKIT_URL=${{ secrets.VITE_LIVEKIT_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          provenance: false

  # ── Job 3: Deploy to EC2 via SSM (no SSH / port 22 needed) ─────────────
  deploy:
    name: Deploy to EC2 (Production)
    needs: build
    runs-on: ubuntu-latest

    # GitHub Environment "production" — configure Required Reviewers in:
    # GitHub → Settings → Environments → production → Required reviewers
    # This pauses the workflow and sends an email asking for approval.
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM SendCommand
        id: ssm-deploy
        run: |
          # Send deployment commands to EC2 via SSM (no SSH, no port 22)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters commands='[
              "set -euo pipefail",
              "cd /home/deploy/app/Eventclick",
              "",
              "echo \"=== [1/6] Pulling latest code from Git ===\"",
              "sudo -u deploy git fetch origin",
              "sudo -u deploy git reset --hard origin/main",
              "",
              "echo \"=== [2/6] Authenticating with ghcr.io ===\"",
              "echo \"${{ secrets.GHCR_PAT }}\" | docker login ghcr.io -u \"${{ secrets.GHCR_USER }}\" --password-stdin",
              "",
              "echo \"=== [3/6] Pulling pre-built images from ghcr.io ===\"",
              "IMAGE_TAG=\"${{ needs.build.outputs.sha_short }}\"",
              "docker pull \"${{ needs.build.outputs.server_image }}:${IMAGE_TAG}\"",
              "docker pull \"${{ needs.build.outputs.client_image }}:${IMAGE_TAG}\"",
              "",
              "echo \"=== [4/6] Tagging images for docker-compose ===\"",
              "docker tag \"${{ needs.build.outputs.server_image }}:${IMAGE_TAG}\" \"eventclick/server:latest\"",
              "docker tag \"${{ needs.build.outputs.client_image }}:${IMAGE_TAG}\" \"eventclick/client:latest\"",
              "",
              "echo \"=== [5/6] Running deploy.sh ===\"",
              "chmod +x scripts/deploy.sh",
              "SKIP_PULL=1 SKIP_BUILD=1 IMAGE_TAG=\"${IMAGE_TAG}\" ./scripts/deploy.sh",
              "",
              "echo \"=== [6/6] Deployment complete ===\"",
              "docker compose -f docker-compose.prod.yml ps",
              "docker stats --no-stream --format \"table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}\" 2>/dev/null || true"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Wait for deployment to complete
        id: ssm-wait
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command ${COMMAND_ID} to complete..."

          # Poll every 15 seconds for up to 5 minutes
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text || echo "InProgress")

            echo "Attempt ${i}/40 — Status: ${STATUS}"

            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ Deployment completed successfully!"

              # Print command output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "❌ Deployment ${STATUS}!"

              # Print stdout
              echo "=== STDOUT ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text || true

              # Print stderr
              echo "=== STDERR ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text || true

              exit 1
            fi

            sleep 15
          done

          echo "❌ Timed out waiting for SSM command to complete"
          exit 1

      # ── Rollback notification on failure ─────────────────────────────────
      - name: Rollback Notification on Failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED — deploy.sh rollback was triggered on EC2"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Action required:"
          echo "  1. Check SSM Run Command history in AWS Console"
          echo "  2. Verify rollback was successful: aws ssm send-command to run 'docker compose ps'"
          echo "  3. Fix the root cause and push a new commit to trigger a fresh deployment"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Commit  : ${{ github.sha }}"
          echo "  SHA     : ${{ needs.build.outputs.sha_short }}"
          echo "  Images  : ${{ needs.build.outputs.server_image }}:${{ needs.build.outputs.sha_short }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

