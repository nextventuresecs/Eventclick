name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel an in-progress deploy

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client

jobs:
  # ── Gate: Only deploy if CI passed ─────────────────────────────────────
  check-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        run: echo "deploy=true" >> $GITHUB_OUTPUT

  # ── Build & Push Docker Images ─────────────────────────────────────────
  build:
    name: Build Docker Images
    needs: check-ci
    runs-on: ubuntu-latest
    if: needs.check-ci.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      # Build Server Image
      - name: Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile.prod
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Client Image
      - name: Build & Push Client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/client/Dockerfile.prod
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_LIVEKIT_URL=${{ secrets.VITE_LIVEKIT_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to EC2 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e
            cd ~/app

            echo "=== Pulling latest code ==="
            git pull --ff-only origin main

            echo "=== Pulling new Docker images ==="
            docker compose -f docker-compose.prod.yml pull server client 2>/dev/null || true

            echo "=== Running migrations ==="
            docker compose -f docker-compose.prod.yml up migrate --build --abort-on-container-exit

            echo "=== Restarting services ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps server
            sleep 10

            echo "=== Health check ==="
            for i in $(seq 1 20); do
              if curl -sf http://localhost:4000/api/v1/health > /dev/null 2>&1; then
                echo "Server healthy ✅"
                break
              fi
              echo "Waiting for server... attempt $i/20"
              sleep 5
            done

            # Verify health check passed
            curl -sf http://localhost:4000/api/v1/health || {
              echo "❌ Health check failed! Rolling back..."
              docker compose -f docker-compose.prod.yml logs --tail=30 server
              exit 1
            }

            echo "=== Restarting client ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps client
            sleep 3

            echo "=== Deployment complete ✅ ==="
            docker compose -f docker-compose.prod.yml ps
            docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}" 2>/dev/null || true

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
