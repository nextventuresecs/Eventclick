# Production Docker Compose — infrastructure services only
# Application containers (server, client) are built and deployed via CI/CD.
# To run locally with prod images:
#   docker compose -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: evently_postgres_prod
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: evently_redis_prod
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── LiveKit (self-hosted WebRTC SFU) ─────────────────────────────────────
  # Production mode: Redis-backed room state, no --dev flag
  livekit:
    image: livekit/livekit-server:latest
    container_name: evently_livekit_prod
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: >
      --config /etc/livekit/config.yaml
      --bind 0.0.0.0
    volumes:
      - ./config/livekit.prod.yaml:/etc/livekit/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Backend API ─────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile.prod
    image: evently/server:${IMAGE_TAG:-latest}
    container_name: evently_server_prod
    restart: always
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  # ─── Frontend (Nginx + Vite static build) ────────────────────────────────
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: evently/client:${IMAGE_TAG:-latest}
    container_name: evently_client_prod
    restart: always
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pg_data_prod:
  redis_data_prod:
