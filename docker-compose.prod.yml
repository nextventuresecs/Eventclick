# ─────────────────────────────────────────────────────────────────────────────
# Production Docker Compose — Eventclick
# ─────────────────────────────────────────────────────────────────────────────
# Target: AWS EC2 t3.small (2 vCPU, 2 GB RAM) + Cloudflare CDN
# LiveKit: Using LiveKit Cloud (free tier) — no self-hosted container needed
# Storage: Cloudflare R2 (S3-compatible, free tier)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f server
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: eventclick_postgres_prod
    restart: always
    # NOT exposed to host — only accessible within Docker network
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      # Performance tuning for 2 GB RAM instance
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_statement=ddl"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "postgres"
        awslogs-create-group: "true"

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eventclick_redis_prod
    restart: always
    expose:
      - "6379"
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 60 100
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 64M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "redis"
        awslogs-create-group: "true"

  # ─── Gotenberg (HTML → PDF) ──────────────────────────────────────────────
  # Required for report PDF generation
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: eventclick_gotenberg_prod
    restart: always
    expose:
      - "3000"
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--api-root-path=/"
      - "--chromium-max-queue-size=5"
      - "--chromium-auto-start=false"
      - "--log-level=warn"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "gotenberg"
        awslogs-create-group: "true"

  # ─── Database Migration (run-once init) ──────────────────────────────────
  # Runs Drizzle migrations before server starts, then exits
  migrate:
    image: ghcr.io/nextventuresecs/eventclick/server:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: eventclick_migrate_prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    command: ["node", "-e", "
      const { Pool } = require('pg');
      const { drizzle } = require('drizzle-orm/node-postgres');
      const { migrate } = require('drizzle-orm/node-postgres/migrator');
      async function run() {
        const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
        await pool.query('CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"');
        await pool.query('CREATE EXTENSION IF NOT EXISTS \"pgcrypto\"');
        await pool.query('CREATE EXTENSION IF NOT EXISTS \"postgis\"');
        const db = drizzle(pool);
        await migrate(db, { migrationsFolder: './packages/server/drizzle' });
        console.log('[migrate] ✅ done');
        await pool.end();
      }
      run().catch(e => { console.error('[migrate] ❌', e); process.exit(1); });"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "migrate"
        awslogs-create-group: "true"

  # ─── Backend API ─────────────────────────────────────────────────────────
  server:
    image: ghcr.io/nextventuresecs/eventclick/server:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: eventclick_server_prod
    restart: always
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      SQS_WORKER_ENABLED: "true"
      SQS_PDF_QUEUE_URL: ${SQS_PDF_QUEUE_URL:-}
      SQS_DLQ_URL: ${SQS_DLQ_URL:-}
      APP_DATABASE_URL: postgresql://app_user_login:${APP_DB_PASSWORD:-}@postgres:5432/${DB_NAME}
      AUTH_DATABASE_URL: postgresql://auth_svc_role:${AUTH_DB_PASSWORD:-}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      # LiveKit Cloud
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # AWS
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      # Cloudflare R2
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Gotenberg (internal Docker network)
      GOTENBERG_URL: http://gotenberg:3000
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Attendance
      ATTENDANCE_WINDOW_BEFORE_MINUTES: ${ATTENDANCE_WINDOW_BEFORE_MINUTES:-15}
      ATTENDANCE_WINDOW_AFTER_MINUTES: ${ATTENDANCE_WINDOW_AFTER_MINUTES:-30}
      # Sentry
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}
      DATA_RETENTION_DRY_RUN: ${DATA_RETENTION_DRY_RUN:-true}
      SENTRY_SERVER_DSN: ${SENTRY_SERVER_DSN:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "server"
        awslogs-create-group: "true"

  # ─── PDF Worker (SQS async job processor) ────────────────────────────────
  pdf-worker:
    image: ghcr.io/nextventuresecs/eventclick/server:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: eventclick_pdf_worker_prod
    restart: always
    command: ["node", "packages/server/dist/worker-entry.js"]
    environment:
      NODE_ENV: production
      SQS_WORKER_ENABLED: "true"
      SQS_PDF_QUEUE_URL: ${SQS_PDF_QUEUE_URL}
      SQS_DLQ_URL: ${SQS_DLQ_URL:-}
      APP_DATABASE_URL: postgresql://app_user_login:${APP_DB_PASSWORD:-}@postgres:5432/${DB_NAME}
      AUTH_DATABASE_URL: postgresql://auth_svc_role:${AUTH_DB_PASSWORD:-}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # AWS
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      GOTENBERG_URL: http://gotenberg:3000
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-365}
      DATA_RETENTION_DRY_RUN: ${DATA_RETENTION_DRY_RUN:-true}
      SENTRY_SERVER_DSN: ${SENTRY_SERVER_DSN:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "pdf-worker"
        awslogs-create-group: "true"

  # ─── Frontend (Nginx + Vite static build) ────────────────────────────────
  # Also acts as the reverse proxy for API + Gotenberg
  client:
    image: ghcr.io/nextventuresecs/eventclick/client:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: eventclick_client_prod
    restart: always
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-south-1}
        awslogs-group: "/eventclick/prod/containers"
        awslogs-stream: "client"
        awslogs-create-group: "true"

volumes:
  pg_data_prod:
  redis_data_prod:
