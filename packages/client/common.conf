root /usr/share/nginx/html;
index index.html;

client_max_body_size 50m;

# ── Real IP Restoration (Cloudflare) ─────────────
real_ip_header CF-Connecting-IP;
set_real_ip_from 0.0.0.0/0;

access_log /dev/stdout;
error_log /dev/stderr warn;

# ── Gzip Compression ────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

# ── Security Headers ────────────────────────────
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com;" always;

# ── Reverse Proxy: API Requests ─────────────────
# Metrics are for a scraper inside the Docker network, never the public
# internet: the endpoint reveals route names, traffic volumes and error rates.
# Denied here rather than authenticated in the app, so the credential-free
# in-network scrape keeps working.
location = /api/v1/metrics {
    deny all;
}

location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 86400s; # 24 hours for long-lived SSE connections

    proxy_buffering off;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;

    proxy_hide_header X-Powered-By;
}

# ── Static Assets (Vite hashed filenames) ───────
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|mp4|webm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
}

# ── SPA Fallback ────────────────────────────────
location / {
    try_files $uri $uri/ /index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# ── Block common attack paths ───────────────────
location ~ /\. {
    deny all;
    return 404;
}

location ~* \.(env|git|sql|bak|log|ini|conf)$ {
    deny all;
    return 404;
}

location ~ ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|admin\.php) {
    deny all;
    return 404;
}

# ── Error Pages ─────────────────────────────────
error_page 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}