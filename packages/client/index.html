<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the installed app can paint into the iOS safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS/iPadOS standalone install. Safari never fires `beforeinstallprompt`,
         so "Add to Home Screen" is the only install path — without these tags it
         produces a screenshot icon and opens in browser chrome, not standalone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eventclick" />
    <link rel="apple-touch-icon" href="/iOS/Icon-60@3x.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/iOS/Icon-60@3x.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/iOS/Icon-76@2x.png" />

    <title>Eventclick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
