# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Production Reverse Proxy + Static SPA
# ─────────────────────────────────────────────────────────────────────────────
# This Nginx serves two roles:
#   1. Serve the React SPA (static files from Vite build)
#   2. Reverse proxy /api/* requests to the Express backend
#
# Cloudflare terminates TLS in front. This Nginx listens on HTTP only.
# Nginx runs as non-root user, so it binds to 8080.
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream: Backend API ───────────────────────────
upstream api_backend {
    server server:4000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # ── Real IP Restoration (Cloudflare) ─────────────
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ── Gzip Compression ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ── Security Headers ────────────────────────────
    # HSTS — tell browsers to always use HTTPS (1 year + subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS filter (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — restrict browser features
    # Allow camera/microphone for LiveKit WebRTC
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # Content Security Policy — allows React SPA + LiveKit + API
    # NOTE: Update the domains below when you have your production domain
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com;" always;

    # ── Reverse Proxy: API Requests ─────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Headers for Express (trust proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Connection keep-alive
        proxy_set_header Connection "";

        # Timeouts (updated for SSE)
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 86400s; # 24 hours for long-lived SSE connections

        # Buffer settings (disabled for real-time SSE)
        proxy_buffering off;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # Don't add security headers for API (server handles its own)
        proxy_hide_header X-Powered-By;
    }

    # ── Static Assets (Vite hashed filenames) ───────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Keep security headers on static assets too
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA Fallback ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html (so deployments take effect immediately)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ── Block common attack paths ───────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|git|sql|bak|log|ini|conf)$ {
        deny all;
        return 404;
    }

    location ~ ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|admin\.php) {
        deny all;
        return 404;
    }

    # ── Error Pages ─────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
