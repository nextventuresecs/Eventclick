# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Production Reverse Proxy + Static SPA
# ─────────────────────────────────────────────────────────────────────────────
# This Nginx serves two roles:
#   1. Serve the React SPA (static files from Vite build)
#   2. Reverse proxy /api/* requests to the Express backend
#
# Cloudflare mode: Full (strict) — origin must terminate real TLS on 443.
# Nginx runs as non-root user, so it binds to 8080 (HTTP) and 8443 (HTTPS).
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream: Backend API ───────────────────────────
upstream api_backend {
    server server:4000;
    keepalive 16;
}

# ── Shared server config (included by both HTTP + HTTPS blocks) ───
# Saved separately so the 8080 and 8443 server{} blocks stay identical.
# NOTE: this file is generated below as common.conf and COPY'd alongside
# nginx.conf in the Docker image; see Dockerfile.prod diff.

server {
    listen 8080;
    server_name _;
    include /etc/nginx/conf.d/common.conf;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/common.conf;
}